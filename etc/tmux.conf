# ~/.tmux.conf

# =============================================================================
# ------------------------------ prefix ---------------------------------------
# =============================================================================
# ctrl+a to match the \u0001 in alacritty.toml's split binds.
set -g prefix C-a
unbind C-b
bind C-a send-prefix

# =============================================================================
# ------------------------------ splits ---------------------------------------
# =============================================================================
# these are what cmd+d / cmd+shift+d trigger
unbind '"'
unbind %
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

# New windows also open in the current directory
bind c new-window -c "#{pane_current_path}"

# =============================================================================
# ---------------------------- pane nav ---------------------------------------
# =============================================================================
# with prefix: ctrl+a then arrow (or h/j/k/l)
bind Left  select-pane -L
bind Down  select-pane -D
bind Up    select-pane -U
bind Right select-pane -R
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R

# without prefix: opt+arrow 
# (option = alt; works via option_as_alt="Both")
bind -n M-Left  select-pane -L
bind -n M-Down  select-pane -D
bind -n M-Up    select-pane -U
bind -n M-Right select-pane -R

# resize panes: prefix then Shift+arrow
bind -r S-Left  resize-pane -L 5
bind -r S-Down  resize-pane -D 5
bind -r S-Up    resize-pane -U 5
bind -r S-Right resize-pane -R 5

# close a pane
bind x kill-pane

# zoom the current pane to fullscreen and back
bind z resize-pane -Z

set -g pane-border-style "fg=#282726"
set -g pane-active-border-style "fg=#4385be"

# =============================================================================
# ----------------------------- colours ---------------------------------------
# =============================================================================
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"

# =============================================================================
# --------------------------- stress-free -------------------------------------
# =============================================================================
set -g escape-time 10         # no lag when hitting Esc in vim/neovim
set -g history-limit 100000   # generous pane history
set -g base-index 1           # windows start at 1, not 0
setw -g pane-base-index 1
set -g renumber-windows on    # keep window numbers sequential after closing
set -g mouse on               # click panes, drag borders, scroll
setw -g mode-keys vi          # vi keys in copy mode
set -g focus-events on        # let nvim react to focus (autoread on refocus)
set -g display-time 2000      # messages linger 2s instead of 0.75s

# =============================================================================
# ---------------------------- copy mode --------------------------------------
# =============================================================================
# v to select; y to yank to the macOS clipboard
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi y send -X copy-pipe-and-cancel "pbcopy"
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-pipe-and-cancel "pbcopy"

# =============================================================================
# ---------------------------- status bar --------------------------------------
# =============================================================================
set -g status-style bg=colour238,fg=white

# =============================================================================
# ------------------------------ reload ---------------------------------------
# =============================================================================
bind r source-file ~/.tmux.conf \; display "tmux.conf reloaded"