# ~/.gnupg/gpg.conf

personal-cipher-preferences AES256 AES192 AES
personal-digest-preferences SHA512 SHA384 SHA256
personal-compress-preferences ZLIB BZIP2 ZIP Uncompressed
default-preference-list AES256 AES192 AES SHA512 SHA384 SHA256 ZLIB BZIP2 ZIP Uncompressed

# key signing and symmetric opsec
cert-digest-algo SHA512
s2k-digest-algo SHA512
s2k-cipher-algo AES256
s2k-count 65011712
charset utf-8              

# info-disclosure prevention
no-comments                     
no-emit-version                 
no-greeting                                   

# key display and verification settings
keyid-format 0xlong           
list-options show-uid-validity,show-unusable-subkeys 
verify-options show-uid-validity 
with-fingerprint               

# security enforcement               
no-symkey-cache               

# output and agent configuration
armor                                     

# enhanced security
weak-digest SHA1               
disable-cipher-algo CAST5    

# trust and verification settings          
auto-key-locate local,wkd,dane,keyserver
