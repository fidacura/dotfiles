# ~/.config/alacritty/alacritty.toml

[general]
live_config_reload = true
import = ["~/.config/alacritty/themes/fidacura.toml"]

[env]
TERM = "xterm-256color"
COLORTERM = "truecolor"

[window]
padding = { x = 12, y = 12 }
dynamic_padding = true
decorations = "buttonless"
opacity = 0.92            
blur = true
startup_mode = "Maximized"   
title = "Alacritty"
dynamic_title = true
resize_increments = true
option_as_alt = "Both"

[scrolling]
history = 100000
multiplier = 3

[font]
# normal = { family = "TX-02", style = "Regular" }
# bold = { family = "TX-02", style = "Bold" }
# italic = { family = "TX-02", style = "Italic" }
# bold_italic = { family = "TX-02", style = "Bold Italic" }
normal = { family = "JetBrainsMono Nerd Font", style = "Regular" }
bold = { family = "JetBrainsMono Nerd Font", style = "Regular" }
italic = { family = "JetBrainsMono Nerd Font", style = "Italic" }
bold_italic = { family = "JetBrainsMono Nerd Font", style = "Bold Italic" }
size = 13.5
offset = { x = 0, y = 6 }
glyph_offset = { x = 0, y = 0 }
builtin_box_drawing = true

[colors]
draw_bold_text_with_bright_colors = false
transparent_background_colors = true

[bell]
animation = "EaseOutExpo"
duration = 80
color = "#ffd700"

[mouse]
hide_when_typing = true
bindings = [
    { mouse = "Middle", action = "PasteSelection" },
]

[hints]
enabled = [
  { regex = "(https://|http://)[^\u0000-\u001F\u007F-\u009F<>\"\\s{-}\\^⟨⟩`]+", command = "open", post_processing = true, mouse = { enabled = true, mods = "Command" }, binding = { key = "U", mods = "Command|Shift" } }
]

[cursor]
style = { shape = "Block", blinking = "On" }
blink_interval = 750
blink_timeout = 8          
unfocused_hollow = true
thickness = 0.5

[terminal]
osc52 = "CopyPaste"
shell = { program = "/bin/zsh", args = ["-l", "-c", "exec /opt/homebrew/bin/tmux new-session -A -s main || exec /bin/zsh -l"] }

# =============================================================================
# -------------------------- key-bindings -------------------------------------
# =============================================================================

# --- clipboard ---
[[keyboard.bindings]]
key = "C"
mods = "Command"
action = "Copy"

[[keyboard.bindings]]
key = "V"
mods = "Command"
action = "Paste"

# --- windows (Alacritty has no tabs; these open real windows) ---
[[keyboard.bindings]]
key = "N"
mods = "Command"
action = "CreateNewWindow"   # was SpawnNewInstance (heavier separate process)

[[keyboard.bindings]]
key = "W"
mods = "Command"
chars = "\u0001x"

[[keyboard.bindings]]
key = "Q"
mods = "Command"
action = "Quit"

# --- font size ---
[[keyboard.bindings]]
key = "Plus"
mods = "Command"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Equals"
mods = "Command"
action = "IncreaseFontSize"

[[keyboard.bindings]]
key = "Minus"
mods = "Command"
action = "DecreaseFontSize"

[[keyboard.bindings]]
key = "Key0"
mods = "Command"
action = "ResetFontSize"

# --- search ---
[[keyboard.bindings]]
key = "F"
mods = "Command"
action = "SearchForward"

[[keyboard.bindings]]
key = "B"
mods = "Command"
action = "SearchBackward"

# --- terminal / history ---
[[keyboard.bindings]]
key = "K"
mods = "Command"
action = "ClearHistory"

[[keyboard.bindings]]
key = "L"
mods = "Command"
action = "ClearLogNotice"

# --- scrolling ---
[[keyboard.bindings]]
key = "Home"
mods = "Command"
action = "ScrollToTop"

[[keyboard.bindings]]
key = "End"
mods = "Command"
action = "ScrollToBottom"

[[keyboard.bindings]]
key = "PageUp"
action = "ScrollPageUp"

[[keyboard.bindings]]
key = "PageDown"
action = "ScrollPageDown"

[[keyboard.bindings]]
key = "Up"
mods = "Command"
action = "ScrollLineUp"

[[keyboard.bindings]]
key = "Down"
mods = "Command"
action = "ScrollLineDown"

# --- vi mode (scroll/select with vim keys) ---
[[keyboard.bindings]]
key = "Space"
mods = "Control|Shift"
action = "ToggleViMode"

# =============================================================================
# --------------------------- tmux splits -------------------------------------
# =============================================================================

# Cmd+D  -> vertical split  (sends Ctrl+a then | )
[[keyboard.bindings]]
key = "D"
mods = "Command"
chars = "\u0001|"

# Cmd+Shift+D -> horizontal split  (sends Ctrl+a then - )
[[keyboard.bindings]]
key = "D"
mods = "Command|Shift"
chars = "\u0001-"

# =============================================================================
# ----------------------------- debug -----------------------------------------
# =============================================================================
[debug]
render_timer = false
persistent_logging = false
log_level = "Warn"
print_events = false

